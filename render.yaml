services:
  - type: web
    name: travelmadi
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn --workers 1 --timeout 90 app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
